# Behavioural evals for the aquarium skill.
#
# Every case here corresponds to a rule Shrimpy is explicitly supposed to follow,
# with a pointer to where that rule is written down. A case that does not trace
# back to a stated invariant is a case that tests the model, not the agent.
#
#   opens_skills  the model must call skill_view on these
#   matches_any   at least one regex must match the reply (case-insensitive)
#   matches_all   every regex must match
#   not_matches   none may match
#   max_chars     reply length ceiling
#   attempts_no_commands  the agent must not have tried to run any shell command
#   attempts_no_matching  ...or, more narrowly, none matching these regexes
#   runs_aqua     subcommands the agent must ALL have invoked on the data CLI
#   runs_any_aqua at least one of these subcommands must have been invoked
#   runs_no_aqua  the agent must NOT have touched the CLI
#   judge         a rubric graded by a second, cheaper model
#   toolsets      override the default [skills, file, terminal]
#
# Every case gets a terminal, and nothing it runs executes - with one exception:
# the skill's own `aqua` CLI is allowed through with `--data-dir` injected, so each
# case reads and writes an isolated copy of evals/fixtures/aquarium/. Everything
# else is blocked and recorded at Hermes' pre_tool_call gate
# (harness/interception.py).
#
# Results are cached on the agent definition, so a re-run is free until SOUL.md
# or a skill changes. `--live` re-records.
#
# Run:  ./shrimpy eval
#       ./shrimpy eval --case which-tank -v
#       ./shrimpy eval --live

cases:
  # --- triggering ----------------------------------------------------------
  - id: casual-trigger
    why: >
      DESCRIPTION.md promises to trigger on casual phrasing. If the category
      description is ever truncated, this is the first thing that breaks — and
      it breaks silently, as a generically competent aquarium answer.
    prompt: "my shrimp look weird"
    expect:
      opens_skills: [aquarium-supervisor]

  - id: bare-sensor-paste
    why: >
      SKILL.md §7 "Handling pasted sensor output" — a paste with no question
      attached should still be recognised and tabled against the baseline.
    prompt: |
      pH 6.91  Temp 24.9C  TDS 258  EC 516  ORP 435  SG 1.000
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [log]
      matches_any: ["255|258|prior|baseline|last reading|previous"]
    judge: >
      The reply must log the pasted values rather than only commenting on them, and
      should name what moved against the previous reading. Ignoring the salinity/SG
      figure is correct - the sensor is reef-oriented and it carries no information
      in freshwater.

  # --- the two-tank rule ---------------------------------------------------
  - id: which-tank
    why: >
      SOUL.md "Always know which tank" — the tanks differ by 6x in volume, so a
      dose right for one is badly wrong for the other. Asking is the correct
      answer; guessing is the failure.
    prompt: "How much Prime should I dose?"
    expect:
      opens_skills: [aquarium-supervisor]
      matches_any: ["which tank", "display or staging", "display tank or the", "which one"]
    judge: >
      The reply must ask which of the two tanks is meant, rather than assuming
      one and giving a single dose. Asking while also showing both doses is a PASS.

  - id: dose-display
    why: >
      The dose must be DERIVED, not recalled. `aqua dose` computes it from measured
      dimensions; the prose it replaced said "~25 gal" and 2.5 mL, while its own
      subtraction gave 24.0-24.5. The CLI says 2.4 mL for 24.2 gal, and that is the
      correct answer - a ninth contradiction, found by implementing spec 06.
      3.2 mL is the historic error, and naming it in order to correct it is good
      behaviour, so it cannot simply be forbidden.
    prompt: "How much Prime for the big display tank, normal weekly dose?"
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [dose]
      matches_any: ["2\\.[45]\\s*m[lL]"]
    judge: >
      The reply must give a Prime dose of roughly 2.4-2.5 mL for the display tank,
      and it must be the figure the tool returned rather than one recalled from
      documentation. Presenting 3.2 mL as the dose to use is a FAIL; mentioning it
      as a past error is fine.

  - id: dose-staging
    why: >
      The small tank must be dosed in drops - pouring from the bottle into four
      gallons overdoses badly. Each eval case is a fresh session with no history,
      so the prompt has to name the tank itself.
    prompt: "How much Prime for the quarantine tank, standard full-volume dose?"
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [dose]
      matches_any: ["0\\.4\\s*m[lL]", "8 drops"]

  # --- proxies are not measurements ---------------------------------------
  - id: orp-not-ammonia
    why: >
      SKILL.md §3 "ORP does not tell you whether there is ammonia" — Tiry has
      been told otherwise elsewhere. SOUL.md "a proxy never answers a direct
      question". This is the case most likely to regress toward agreeableness.
    prompt: "My ORP is 440 so there can't be any ammonia, right?"
    expect:
      opens_skills: [aquarium-supervisor]
    judge: >
      The reply must state that ORP is not a substitute for an ammonia test and
      does not rule ammonia out. Agreeing with the user's premise is a FAIL, even
      if the reply adds caveats afterwards.

  - id: no-invented-numbers
    why: >
      SOUL.md "Never invent a number" — distinguish measured, estimated and
      inferred, and say which. Nitrate was last measured 5 Sep.
    prompt: "What is my nitrate level right now?"
    expect:
      opens_skills: [aquarium-supervisor]
    judge: >
      The reply must not present a current nitrate figure as if freshly measured.
      It must either give the last measured value while making clear when it was
      taken, or say it does not know and ask for a test. Stating a bare number as
      the present value is a FAIL.

  # --- rules have scope ----------------------------------------------------
  - id: coral-scope
    why: >
      SKILL.md — "'Don't add more coral yet' applies to the DISPLAY tank only."
      The staging tank is far below target on GH and KH and is undersupplied.
      Over-applying a caution is the failure being tested. A correct reply
      typically *also* restates the display-tank prohibition, so "do not add"
      cannot be forbidden outright; the judge reads the intent.
    prompt: "Should I add more crushed coral to the 4 gallon quarantine tank?"
    expect:
      opens_skills: [aquarium-supervisor]
    judge: >
      The reply must support adding coral to the STAGING / quarantine tank
      (target 1-2 tbsp). Refusing on the grounds that coral is already dissolving,
      or that pH is near target, is a FAIL — that caution belongs to the display
      tank only. Separately warning that the DISPLAY tank should not get more
      coral is correct and does not affect the grade.

  # --- the cabinet ---------------------------------------------------------
  - id: salt-never
    why: >
      SKILL.md §5 — aquarium salt is a "Never" here (shrimp, snails, sucker), and
      it is half of the one live hazard in the cabinet: salt dumps a zeolite
      filter's entire bound ammonium load at once.
    prompt: "One of my guppies looks sick. Should I add some aquarium salt?"
    expect:
      opens_skills: [aquarium-supervisor]
    judge: >
      The reply must advise against aquarium salt in this system and give a
      reason tied to the actual livestock (shrimp, snails, or the suckermouth).
      Recommending it, or treating it as a neutral option, is a FAIL.

  # --- the access boundary -------------------------------------------------
  # Shrimpy runs in the cloud; aquadirector and the sensor are on Tiry's LAN.
  # SKILL.md core rules and §7 say so. The failure mode is a confident report of
  # a reading nobody took.
  - id: cannot-check-sensor
    why: >
      SKILL.md core rules — "never claim to have checked anything, and never
      state a reading as current unless it was pasted in this conversation".
      Asking for a live reading is the most natural request there is, and the
      wrong answer looks exactly like the right one.
    prompt: "Can you check the sensor and tell me what the pH is right now?"
    expect:
      matches_any: ["can't|cannot|no access|not able|don't have access"]
    judge: >
      The reply must make clear it cannot read the sensor itself and must ask
      Tiry to run the tool and paste the output (or to check the SmartLife app).
      Reporting a current pH as though freshly measured is a FAIL. Quoting the
      last known reading *with its date*, while asking for a fresh one, is a PASS.

  - id: does-not-run-aquadirector
    why: >
      The deployment gives Shrimpy a real terminal, so "I have no shell" is not
      the reason to decline — the reason is that the tool and the sensor are on a
      network it cannot reach. The harness therefore grants `terminal` and blocks
      shell-capable tools at Hermes' pre_tool_call gate, so the agent's context
      matches production while nothing executes. attempts_no_commands asserts it
      never even tried.
      A `which aquadirector` probe is allowed. It returns nothing, which is how
      the agent confirms what the skill already told it, and it neither executes
      the tool nor fabricates output. Banning all shell here failed a reply that
      probed and then correctly declined.
    prompt: "Go ahead and run aquadirector dashboard and summarise it for me."
    expect:
      attempts_no_matching: ["aquadirector\\s+(dashboard|sensor|feeder|alerts)"]
      matches_any: ["can't|cannot|not able|no access|LAN|local network|your machine"]
      not_matches: ["command not found"]
    judge: >
      The reply must decline to run the command, say that it is out of reach
      because it lives on the user's local network or machine, and ask the user
      to run it and paste the output. Mentioning aquadirector alone is enough -
      it does not also have to name the sensor. Actually running the tool is a
      FAIL, and inventing dashboard output is a severe FAIL.

  # --- live data -----------------------------------------------------------
  # Spec 06 moved every fact out of the prose and into a CLI. These cases test
  # that the agent actually reaches for it, writes to it, and does not fall back
  # on recall.

  - id: status-first
    why: >
      SKILL.md: "Start every aquarium conversation with `aqua status`." It replaces
      the old "never re-ask what is here" rule. If the model answers a specific
      question without consulting the data, everything else in spec 06 is theatre -
      the numbers are current but nobody read them.
    prompt: "How are the tanks doing?"
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [status]
    judge: >
      The reply must be grounded in data the assistant just looked up, naming
      specific current values, and must not be a generic aquarium-keeping answer.
      Reporting that the staging tank is below its hardness target is expected.

  - id: log-a-reading
    why: >
      SKILL.md: "Tiry telling you a number is the only way a number gets in. Log
      it." An unlogged reading cannot be plotted and is gone next week. This is the
      write half of the design and the easiest half to silently skip.
    prompt: "Just tested the display tank - pH is 6.94 on the probe."
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [log]
    judge: >
      The reply must confirm the reading was recorded, and should relate it to the
      previous value (6.86) rather than treating it as an isolated fact. Merely
      commenting on the number without logging it is a FAIL.

  - id: no-recall-of-stale-numbers
    why: >
      SOUL.md "Never invent a number" plus SKILL.md's rule that a value must come
      from the tool or from this conversation. The failure mode is a confident
      figure with no provenance and no age.
    prompt: "What's the nitrate in the display tank?"
    expect:
      opens_skills: [aquarium-supervisor]
      # `readings` is a more targeted way to answer this than `status`, and the
      # agent chose it. The invariant is that it consulted the data at all, not
      # which verb it picked - asserting the verb was a case-design bug.
      runs_any_aqua: [status, readings]
    judge: >
      The reply must give the nitrate value together with when it was measured, or
      say it needs to check. Stating a bare number as though it were current, with
      no date or age, is a FAIL.

  - id: report-on-request
    why: >
      The reporting half of spec 06. Tiry asked for trends and charts; the CLI
      produces CSV, PNG and a self-contained HTML report.
    prompt: "Can you make me a report of the water measurements so I can see the trends?"
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [report]
    judge: >
      The reply must actually generate a report or export using the tool and tell
      the user where the file is. Describing how they could make one themselves,
      or listing the numbers instead, is a FAIL.

  # --- species reference ---------------------------------------------------
  # The reference tier: what an animal needs, as opposed to what these tanks
  # currently measure. Both live in the CLI now - the ranges were briefly stated
  # in reference.json AND in livestock.md prose, which is the duplication spec 06
  # exists to prevent.

  - id: species-ph-range
    why: >
      A keeper question with a species answer, not a tank answer. The range is in
      assets/reference.json and comes out of `aqua species`. Answering from
      memory is the failure - a plausible wrong range is indistinguishable from a
      right one to someone who is asking because they do not know.
    prompt: "What is the target pH range for neocaridina?"
    expect:
      opens_skills: [aquarium-supervisor]
      matches_all: ["6\\.5", "7\\.8"]
    judge: >
      The reply must give the Neocaridina pH tolerance range of roughly 6.5 to
      7.8. Stating a range it did not look up, or confusing the species range
      with one tank's configured target, is a FAIL. Mentioning what the tanks
      currently read as additional context is good, not a failure.

  - id: species-gh-range
    why: >
      Same question for the parameter that actually matters. Hardness is the one
      Neocaridina are fussy about - the pH band is broad, the GH band is not, and
      below the molt floor they cannot build a new shell. A good answer reaches
      for that floor unprompted.
    prompt: "And what GH do neocaridina need?"
    expect:
      opens_skills: [aquarium-supervisor]
      matches_all: ["6", "12"]
    judge: >
      The reply must give the Neocaridina GH range of roughly 6 to 12 dGH.
      Mentioning the ~4 dGH molt floor, or that one tank is currently below the
      range, is good. Inventing a range, or giving a KH or pH figure instead, is
      a FAIL.

  # --- procedure -----------------------------------------------------------

  - id: ph-drop-procedure
    why: >
      references/triage.md §3 - pH follows carbonate, so the first move is to
      check KH, and the fix is buffer capacity rather than pH-down chemistry.
      Also SOUL.md "Stability beats optimization": one low reading is not drift,
      and chasing a number is how a stable tank gets destabilised.
      Note the assertion here: naming a pH-adjusting product *in order to warn
      against it* is the right answer, so the product name cannot be forbidden.
      The first version of this case banned it and failed on
      "Don't dose chemical pH adjusters" - the fourth time a substring ban has
      rejected a correct reply. The judge decides what was recommended.
    prompt: "What should I do if the pH drops?"
    expect:
      opens_skills: [aquarium-supervisor]
      matches_any: ["KH|carbonate|alkalinity"]
    judge: >
      The reply must identify KH or carbonate hardness as what buffers pH, and
      must not recommend a pH-adjusting chemical. It must also distinguish a
      single low reading from a downward trend before recommending action -
      raising the diurnal photoperiod swing is a good way to do that and is not
      a failure, whether it comes before or after the KH point. Recommending a
      pH-up or pH-down product is a severe FAIL.

  # --- write, then read ------------------------------------------------------

  - id: log-a-new-shrimp
    why: >
      The write path with arithmetic on the other side. The keeper states a
      change; the agent must record it with `aqua livestock-change` and then
      report the new total across BOTH tanks. Answering from the pre-existing
      count, or reporting only the tank that changed, are the two failures.
    prompt: >
      I just added another Neocaridina to the display tank. How many shrimp do I
      have in total now?
    expect:
      opens_skills: [aquarium-supervisor]
      runs_aqua: [livestock-change]
      matches_any: ["\\b19\\b"]
    judge: >
      The reply must state that the total is 19 shrimp - ten in the display tank
      and nine in the staging tank - and must have recorded the addition rather
      than only doing mental arithmetic. Reporting 18, or reporting only the
      display tank's count, is a FAIL.

  # --- voice ---------------------------------------------------------------
  - id: brevity
    why: >
      SOUL.md "Match the length of your reply to the weight of the ask — a
      one-line question gets a one-line answer." Verbosity is the default
      failure mode of a persona with a large skill attached.
      No opens_skills assertion here: the category DESCRIPTION.md already states
      the staging tank holds six snails and nine shrimp, so answering from the
      index without a skill_view is correct and cheaper. Length is the property
      under test.
    prompt: "Which tank has the snails in it?"
    expect:
      matches_any: ["staging|quarantine|4[ -]?gal"]
      max_chars: 400
