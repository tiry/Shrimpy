# CI for the Shrimpy agent definition.
#
# Three jobs, cheapest first:
#
#   lint    ruff, no submodule, no venv
#   skill   the skill's CLI on system Python 3.11-3.13, no submodule, no venv
#   test    the full offline suite, which needs hermes-agent installed
#
#   live    the behavioural evals against a real model — monthly and on demand
#
# There is no build artifact in this repo, so "does it install from clean" is the
# equivalent check — that is `./shrimpy setup` in the `test` job.
#
# WHY `live` IS NOT ON EVERY PUSH
#
# It costs money (~$0.42 a run) and it is a drift detector, not a regression
# gate: the offline suite already catches anything a code change can break. What
# `live` catches is what offline structurally cannot — the model alias moving or
# being retired, auth breaking, or the provider changing behaviour under a stable
# name. That is a slow failure, so it runs on a schedule.
#
# It is also never triggered by `pull_request`. Secrets would be exposed to
# whatever code that PR contains.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the behavioural evals against a real model (~$0.42)"
        type: boolean
        default: false
  schedule:
    # 06:00 UTC on the 1st. Monthly is deliberate: see the header.
    - cron: "0 6 1 * *"

# A second push to the same ref makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned. Unpinned, a ruff release that adds a rule fails CI on a commit that
  # changed nothing.
  RUFF_VERSION: "0.15.12"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # No submodules: ruff.toml excludes vendor/, and linting needs no
        # dependencies at all.

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Lint
        run: ruff check . --output-format=github

  skill:
    name: skill CLI (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is hermes-agent's floor, 3.13 is what the deployment container
        # ships. The CLI has to work on both.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        # No submodule on purpose. This job exists to prove the skill's claim
        # that it is stdlib-only: if it passes without hermes-agent anywhere on
        # the path, then copying the skill directory really is the whole
        # installation.

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies only
        # pytest and pyyaml are the harness's, not the skill's. The skill itself
        # must import nothing outside the standard library, which
        # test_cli_is_stdlib_only enforces against sys.stdlib_module_names.
        run: pip install pytest pyyaml

      - name: Run the CLI directly
        run: |
          python skills/aquarium/aquarium-supervisor/scripts/aqua.py \
            --data-dir "${RUNNER_TEMP}/aquarium" status
          python skills/aquarium/aquarium-supervisor/scripts/aqua.py \
            --data-dir "${RUNNER_TEMP}/aquarium" doctor

      - name: Tests that need no hermes-agent
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_aqua_cli.py \
            tests/test_no_drift.py \
            tests/test_profile_layout.py

  test:
    name: offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The submodule is a shallow checkout of a large repository: ~253 MB
          # at the pinned tag. Full history would be gigabytes for no benefit.
          fetch-depth: 1

      - name: Record the pinned hermes-agent revision
        id: hermes
        run: echo "sha=$(git -C vendor/hermes-agent rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Pinned to an exact release: astral-sh only publishes moving major tags up
      # to v7, so `@v10` does not resolve even though v10.0.1 is the latest
      # release. Third-party actions are worth pinning exactly regardless.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # The dependency set only moves when the submodule or the install
          # script does.
          cache-suffix: ${{ steps.hermes.outputs.sha }}-${{ hashFiles('scripts/setup.sh') }}

      - name: Build — install uv, the venv and hermes-agent
        run: ./shrimpy setup

      - name: Offline checks
        # No API key, no network, no cost. See the header for why the evals are
        # not here.
        run: ./shrimpy test

      - name: The assembled system prompt still renders the skill
        # A cheap canary for the failure that logs nothing: a skill dropped from
        # the index leaves the agent answering fluently about tanks it no longer
        # knows. `prompt --skills` exits 1 when the block is empty.
        run: ./shrimpy prompt --skills

      - name: Render a pH trend, end to end
        # The offline tests assert the plotted line follows the data by reading
        # the pixels back. This produces the chart so a human can look at it —
        # a green tick does not tell you whether a chart is legible.
        run: ./scripts/demo-trend.sh "${RUNNER_TEMP}/demo"

      - name: Show the trend in the job summary
        # GitHub sanitises data: URIs out of summaries, so the PNG cannot be
        # inlined here — it goes up as an artifact. The sparkline is text and
        # travels fine, which makes the shape visible without a download.
        run: |
          {
            echo "## pH trend — display tank"
            echo
            echo '```'
            python3 skills/aquarium/aquarium-supervisor/scripts/aqua.py \
              --data-dir "${RUNNER_TEMP}/demo/data" readings ph --tank display --limit 14
            echo '```'
            echo
            echo "Chart and self-contained HTML report are in the **ph-trend** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the chart
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ph-trend
          path: |
            ${{ runner.temp }}/demo/ph-trend.png
            ${{ runner.temp }}/demo/report.html
            ${{ runner.temp }}/demo/csv/
          retention-days: 30
          if-no-files-found: error

  live:
    name: behavioural evals (real model)
    # Scheduled, or requested explicitly. Never on pull_request — see the header.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record the pinned hermes-agent revision
        id: hermes
        run: echo "sha=$(git -C vendor/hermes-agent rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ steps.hermes.outputs.sha }}-${{ hashFiles('scripts/setup.sh') }}

      - run: ./shrimpy setup

      - name: Check the key is present
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run the evals live
        id: evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # --live ignores the snapshot cache, which is the entire point: a cached
        # pass proves nothing about the model as it behaves today. -j 2 because
        # OpenRouter reserves credit for each in-flight request's max_tokens, so
        # higher parallelism can 402 on a healthy key.
        #
        # Exit codes: 0 all passed, 1 the agent misbehaved, 3 the provider was
        # unreachable and nothing was proven.
        run: |
          set +e
          ./shrimpy eval --live -j 2
          code=$?
          set -e
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Interpret the result
        run: |
          case "${{ steps.evals.outputs.code }}" in
            0) echo "::notice::All behavioural evals passed against the live model." ;;
            3) echo "::warning::The provider was unreachable, so nothing was proven." \
                    "Not an agent failure — re-run when it recovers." ;;
            *) echo "::error::The agent behaved wrongly against the live model." \
                    "This is a real regression, not a provider blip."
               exit 1 ;;
          esac

      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
